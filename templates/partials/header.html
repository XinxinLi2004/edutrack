<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} - EduFlow</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script defer src="/static/js/app.js"></script>
  <link rel="icon" type="image/png" href="/static/images/logo.png">
  <style>
    .icon {
      width: 1.2em;
      height: 1.2em;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <!-- SVG 图标库 -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
    <symbol id="icon-dashboard" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="icon-students" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
    <symbol id="icon-classes" viewBox="0 0 24 24"><path d="M22 10v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5"/><path d="M6 9h12"/><path d="M6 15h8"/></symbol>
    <symbol id="icon-courses" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></symbol>
    <symbol id="icon-grades" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></symbol>
    <symbol id="icon-assignments" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9 14l2 2 4-4"/></symbol>
    <symbol id="icon-attendance" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></symbol>
    <symbol id="icon-payments" viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
    <symbol id="icon-edit" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
    <symbol id="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></symbol>
    <symbol id="icon-monitor" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></symbol>
  </svg>

  <div class="app-layout">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon"><img src="/static/images/logo.png" alt="EduFlow"></div>
          <span>EduFlow</span>
        </div>
        <div class="sidebar-subtitle">学员管理系统</div>
      </div>
      
      <nav class="sidebar-nav">
        <a href="/" class="nav-item {% if active_menu == 'dashboard' %}active{% endif %}">
          <svg class="icon"><use href="#icon-dashboard"/></svg>
          <span>仪表盘</span>
        </a>
        <a href="/students" class="nav-item {% if active_menu == 'students' %}active{% endif %}">
          <svg class="icon"><use href="#icon-students"/></svg>
          <span>学员管理</span>
        </a>
        <a href="/classes" class="nav-item {% if active_menu == 'classes' %}active{% endif %}">
          <svg class="icon"><use href="#icon-classes"/></svg>
          <span>班级管理</span>
        </a>
        <a href="/courses" class="nav-item {% if active_menu == 'courses' %}active{% endif %}">
          <svg class="icon"><use href="#icon-courses"/></svg>
          <span>课程管理</span>
        </a>
        <a href="/grades" class="nav-item {% if active_menu == 'grades' %}active{% endif %}">
          <svg class="icon"><use href="#icon-grades"/></svg>
          <span>成绩管理</span>
        </a>
        <a href="/rank-compare" class="nav-item {% if active_menu == 'rank-compare' %}active{% endif %}">
          <svg class="icon"><use href="#icon-dashboard"/></svg>
          <span>排名对比</span>
        </a>
        <a href="/assignments" class="nav-item {% if active_menu == 'assignments' %}active{% endif %}">
          <svg class="icon"><use href="#icon-assignments"/></svg>
          <span>作业管理</span>
        </a>
        <a href="/attendances" class="nav-item {% if active_menu == 'attendances' %}active{% endif %}">
          <svg class="icon"><use href="#icon-attendance"/></svg>
          <span>出勤记录</span>
        </a>
        <a href="/payments" class="nav-item {% if active_menu == 'payments' %}active{% endif %}">
          <svg class="icon"><use href="#icon-payments"/></svg>
          <span>缴费管理</span>
        </a>
      </nav>
      
      <div class="sidebar-footer">
        EduFlow · 学员管理系统 v1.0
      </div>
    </aside>

    <!-- 移动端侧边栏遮罩 -->
    <div class="sidebar-overlay" aria-hidden="true"></div>

    <!-- 主内容 -->
    <main class="main-content">
