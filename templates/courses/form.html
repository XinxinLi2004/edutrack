{% include "partials/header.html" %}

<div class="top-bar">
  <div>
    <h1 class="page-title">{% if course.id %}编辑课程{% else %}新增课程{% endif %}</h1>
    <p class="page-subtitle">安排课程时间、地点和上课方式</p>
  </div>
</div>

<form method="post" action="{% if course.id %}/courses/{{ course.id }}{% else %}/courses{% endif %}" class="form-card">
  <div class="form-grid">
    <div class="form-group">
      <label class="form-label">课程标题 *</label>
      <input type="text" name="title" class="form-input" required value="{{ course.title }}" placeholder="例如：运动学专题复习">
    </div>

    <div class="form-group">
      <label class="form-label">所属班级 *</label>
      <select name="class_id" class="form-select" required>
        <option value="">请选择班级</option>
        {% for class in classes %}
          <option value="{{ class.id }}" {% if class.id == course.class_id %}selected{% endif %}>{{ class.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">上课方式</label>
      <select name="mode" class="form-select">
        <option value="offline" {% if course.mode == 'offline' %}selected{% endif %}>线下</option>
        <option value="online" {% if course.mode == 'online' %}selected{% endif %}>线上</option>
        <option value="hybrid" {% if course.mode == 'hybrid' %}selected{% endif %}>线上线下同步</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">上课时间</label>
      <input type="datetime-local" name="scheduled_at" class="form-input" value="{{ course.scheduled_at }}">
    </div>

    <div class="form-group">
      <label class="form-label">时长（分钟）</label>
      <input type="number" name="duration" class="form-input" value="{% if course.duration %}{{ course.duration }}{% else %}120{% endif %}" placeholder="120">
    </div>

    <div class="form-group">
      <label class="form-label">上课地点 / 线上链接</label>
      <input type="text" name="location" class="form-input" value="{{ course.location }}" placeholder="例如：教室A 或 腾讯会议号">
    </div>

    <div class="form-group">
      <label class="form-label">状态</label>
      <select name="status" class="form-select">
        <option value="planned" {% if course.status == 'planned' %}selected{% endif %}>计划中</option>
        <option value="completed" {% if course.status == 'completed' %}selected{% endif %}>已完成</option>
        <option value="cancelled" {% if course.status == 'cancelled' %}selected{% endif %}>已取消</option>
      </select>
    </div>
  </div>

  <div class="form-group">
    <label class="form-label">课程描述</label>
    <textarea name="description" class="form-textarea" placeholder="本节课内容、教学目标等">{{ course.description }}</textarea>
  </div>

  <div class="flex items-center gap-4 mt-4">
    <button type="submit" class="btn btn-primary">
      <svg class="icon"><use href="#icon-plus"/></svg>
      {% if course.id %}保存修改{% else %}确认添加{% endif %}
    </button>
    <a href="/courses" class="btn btn-secondary">取消</a>
  </div>
</form>

{% include "partials/footer.html" %}
